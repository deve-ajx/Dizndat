c.querySelectorAll('.ap').forEach(b=>b.onclick=()=>open(`<h2>Approve Pro</h2><label>Duration${durSel('ad')}</label><button class="pri" id="go" style="margin-top:14px">Approve</button>`)||($('#go').onclick=()=>{const u=b.dataset.u,d=+$('#ad').value;close();done(()=>grant(u,d,'approved request',[bt=>bt.update(doc(db,'premiumRequests',u),{status:'approved',reviewedBy:curU().uid,reviewedAt:ts()})]),'Approved')}));
c.querySelectorAll('.rj').forEach(b=>b.onclick=()=>{const n=prompt('Reason (shown to the user)');if(n===null)return;done(async()=>{const bt=writeBatch(db);bt.update(doc(db,'premiumRequests',b.dataset.u),{status:'rejected',reviewNote:n,reviewedBy:curU().uid,reviewedAt:ts()});bt.set(doc(collection(db,'adminAuditLogs')),{admin:curU().uid,userId:b.dataset.u,action:'reject_premium_request',reason:n,createdAt:ts()});await bt.commit()},'Rejected')});
c.querySelectorAll('.rv').forEach(b=>b.onclick=()=>{if(!confirm('Revoke Pro for this user?'))return;done(async()=>{const bt=writeBatch(db);bt.update(doc(db,'users',b.dataset.u),{premium:false,premiumRevokedAt:ts(),premiumRevokedBy:curU().uid,updatedAt:ts()});bt.set(doc(collection(db,'adminAuditLogs')),{admin:curU().uid,userId:b.dataset.u,action:'revoke_premium',createdAt:ts()});await bt.commit()},'Revoked')});
$('#af').onsubmit=e=>{e.preventDefault();const m=new FormData(e.target).get('m').trim();if(!m)return;done(()=>addDoc(collection(db,'announcements'),{message:m,createdAt:serverTimestamp(),createdBy:curU().uid}),'Notification sent to all users')};
$('#gf').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));done(()=>grant(f.u.trim(),+$('#gd').value,f.r),'Pro granted')};
c.querySelectorAll('.pa').forEach(b=>b.onclick=()=>done(()=>grant(b.dataset.u,365,'manual OPay payment',[bt=>bt.update(doc(db,'manualPaymentRequests',b.dataset.i),{status:'approve',reviewedBy:curU().uid,reviewedAt:ts()})]),'Payment approved'));
c.querySelectorAll('.pj').forEach(b=>b.onclick=()=>{const n=prompt('Reason');if(n===null)return;done(()=>updateDoc(doc(db,'manualPaymentRequests',b.dataset.i),{status:'reject',reviewReason:n,reviewedBy:curU().uid,reviewedAt:ts()}),'Rejected')})}
catch(er){c.innerHTML=`<div class="pg"><div class="card"><h2>Staff dashboard</h2><p class="mut">${esc(er.code==='permission-denied'?'Permission denied. Publish the new Firestore rules first.':er.message)}</p></div></div>`}}
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
